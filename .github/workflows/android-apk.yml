      - name: Add editable trip fuel price to cost calculator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android-project/app/src/main/java/com/oli/routesave/ui/compose/RouteSaveComposeApp.kt")
          s = p.read_text()
          state_old = '    var overrideText by rememberSaveable { mutableStateOf("") }'
          state_new = state_old + '\n    var fuelPriceText by rememberSaveable(vehicle?.id) { mutableStateOf(vehicle?.fuelPricePerLiter?.toString() ?: "") }'
          if state_old not in s:
              raise SystemExit("Calculator consumption state not found.")
          if "var fuelPriceText by rememberSaveable(vehicle?.id)" not in s:
              s = s.replace(state_old, state_new, 1)
          pattern = r'(?m)^\s*OutlinedTextField\(\n\s*value = overrideText,.*?^\s*\)'
          match = re.search(pattern, s, re.S | re.M)
          if not match:
              raise SystemExit("Could not locate consumption field for safe insertion.")
          block = match.group(0)
          if "Cena paliva (€/l; predvolená z profilu vozidla)" not in s:
              field = '''
              OutlinedTextField(
                  value = fuelPriceText,
                  onValueChange = { fuelPriceText = it; resultText = ""; lastSavedEstimate = null; saveMessage = "" },
                  label = { Text("Cena paliva (€/l; predvolená z profilu vozidla)") },
                  modifier = Modifier.fillMaxWidth(),
                  singleLine = true
              )'''
              s = s[:match.end()] + field + s[match.end():]
          parse = "val override = overrideText.trim().takeIf { it.isNotEmpty() }?.replace(',', '.')?.toDoubleOrNull()"
          if parse not in s:
              raise SystemExit("Calculator override parsing not found.")
          if "val fuelPrice = fuelPriceText.trim()" not in s:
              s = s.replace(parse, parse + "\n                        val fuelPrice = fuelPriceText.trim().replace(',', '.').toDoubleOrNull()", 1)
          s = s.replace("if (distance == null || toll == null || parking == null ||", "if (distance == null || fuelPrice == null || toll == null || parking == null ||", 1)
          s = s.replace("(overrideText.isNotBlank() && override == null)) {", "fuelPrice <= 0.0 || (overrideText.isNotBlank() && override == null)) {", 1)
          old = "fuelPricePerLitre = currentVehicle.fuelPricePerLiter"
          if s.count(old) < 2:
              raise SystemExit("Expected calculation and history price references.")
          s = s.replace(old, "fuelPricePerLitre = fuelPrice", 2)
          p.write_text(s)
          print("Inserted per-trip fuel price and connected it to calculation and history.")
          PY

      - name: Add nearby fuel station search to route screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-project/app/src/main/java/com/oli/routesave/ui/compose/RouteSaveComposeApp.kt")
          s = p.read_text()
          import re
          state_match = re.search(r'(?m)^\s*var calculating by rememberSaveable\s*\{\s*mutableStateOf\(false\)\s*\}', s)
          if not state_match:
              raise SystemExit("Route screen calculating state not found; refusing unsafe fuel-station patch.")
          if "var fuelStationsText by rememberSaveable" not in s:
              state_line = state_match.group(0)
              indent = state_line[:len(state_line) - len(state_line.lstrip())]
              insertion = "\n" + indent + 'var fuelStationsText by rememberSaveable { mutableStateOf("") }' + "\n" + indent + 'var findingFuelStations by rememberSaveable { mutableStateOf(false) }'
              s = s[:state_match.end()] + insertion + s[state_match.end():]
          ui_match = re.search(r'(?m)^\s*Text\(routeStatus,.*fontSize = 13\.sp\)', s)
          if not ui_match:
              raise SystemExit("Route status UI not found; refusing unsafe fuel-station patch.")
          ui_anchor = ui_match.group(0)
          ui = '''              Text(routeStatus, color = MaterialTheme.colorScheme.onSurfaceVariant, fontSize = 13.sp)
              Button(
                  enabled = !findingFuelStations && startPlace.isNotBlank(),
                  onClick = {
                      scope.launch {
                          findingFuelStations = true
                          fuelStationsText = "Vyhľadávam čerpacie stanice pozdĺž trasy…"
                          try {
                              val point = geocode(startPlace.trim())
                              val destinationPoint = geocode(destinationPlace.trim())
                              val sampleFractions = listOf(0.0, 0.25, 0.5, 0.75, 1.0)
                              val samplePoints = sampleFractions.map { fraction ->
                                  Pair(
                                      point.first + (destinationPoint.first - point.first) * fraction,
                                      point.second + (destinationPoint.second - point.second) * fraction
                                  )
                              }
                              val uniqueElements = linkedMapOf<String, org.json.JSONObject>()
                              val endpoints = listOf(
                                  "https://overpass-api.de/api/interpreter",
                                  "https://overpass.kumi.systems/api/interpreter",
                                  "https://overpass.private.coffee/api/interpreter"
                              )
                              // Query one corridor point at a time. Smaller requests are less likely to fail with HTTP 500.
                              kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {
                                  var successfulQueries = 0
                                  var lastError = "Mapová služba neodpovedá"
                                  for (sample in samplePoints) {
                                      val query = "[out:json][timeout:15];(node(around:3000," + sample.second + "," + sample.first + ")[amenity=fuel];way(around:3000," + sample.second + "," + sample.first + ")[amenity=fuel];relation(around:3000," + sample.second + "," + sample.first + ")[amenity=fuel];);out center tags;"
                                      val encodedQuery = java.net.URLEncoder.encode(query, "UTF-8")
                                      var sampleLoaded = false
                                      for (endpoint in endpoints) {
                                          var connection: java.net.HttpURLConnection? = null
                                          try {
                                              connection = (java.net.URL(endpoint).openConnection() as java.net.HttpURLConnection).apply {
                                                  requestMethod = "POST"
                                                  doOutput = true
                                                  connectTimeout = 10000
                                                  readTimeout = 20000
                                                  setRequestProperty("User-Agent", "OLI-RouteSave/1.0 (Android; fuel station lookup)")
                                                  setRequestProperty("Accept", "application/json")
                                                  setRequestProperty("Content-Type", "application/x-www-form-urlencoded; charset=UTF-8")
                                              }
                                              connection.outputStream.bufferedWriter(Charsets.UTF_8).use { it.write("data=" + encodedQuery) }
                                              val status = connection.responseCode
                                              val stream = if (status in 200..299) connection.inputStream else connection.errorStream
                                              val response = stream?.bufferedReader()?.use { it.readText() } ?: ""
                                              if (status in 200..299 && response.isNotBlank() && response.trimStart().startsWith("{")) {
                                                  val elements = org.json.JSONObject(response).optJSONArray("elements") ?: org.json.JSONArray()
                                                  for (i in 0 until elements.length()) {
                                                      val element = elements.optJSONObject(i) ?: continue
                                                      val id = element.optString("type") + "/" + element.optString("id")
                                                      if (!uniqueElements.containsKey(id)) uniqueElements[id] = element
                                                  }
                                                  successfulQueries++
                                                  sampleLoaded = true
                                                  break
                                              }
                                              lastError = "Mapová služba HTTP " + status
                                          } catch (e: Exception) {
                                              lastError = e.message ?: e.javaClass.simpleName
                                          } finally {
                                              connection?.disconnect()
                                          }
                                      }
                                      // Continue through remaining points even if one public endpoint is temporarily unavailable.
                                  }
                                  if (successfulQueries == 0) throw java.io.IOException("Vyhľadávanie zlyhalo: " + lastError)
                              }
                              if (uniqueElements.isEmpty()) {
                                  fuelStationsText = "V okolí tejto trasy sa nenašli čerpacie stanice. Skús inú trasu alebo to zopakuj neskôr."
                              }
                              val rows = mutableListOf<Pair<Double, String>>()
                              val routeRoadKm = routeDistanceKm?.toDoubleOrNull()
                              for (element in uniqueElements.values) {
                                  val tags = element.optJSONObject("tags") ?: org.json.JSONObject()
                                  val name = tags.optString("name").takeIf { it.isNotBlank() } ?: tags.optString("brand").takeIf { it.isNotBlank() } ?: "Čerpacia stanica bez názvu"
                                  val brand = tags.optString("brand").takeIf { it.isNotBlank() && it != name }
                                  val longitude = if (element.has("lon")) element.optDouble("lon") else element.optJSONObject("center")?.optDouble("lon") ?: Double.NaN
                                  val latitude = if (element.has("lat")) element.optDouble("lat") else element.optJSONObject("center")?.optDouble("lat") ?: Double.NaN
                                  var nearestFraction = 0.0
                                  var nearestDistanceKm = Double.MAX_VALUE
                                  if (!longitude.isNaN() && !latitude.isNaN()) {
                                      for (fraction in sampleFractions) {
                                          val sampleLongitude = point.first + (destinationPoint.first - point.first) * fraction
                                          val sampleLatitude = point.second + (destinationPoint.second - point.second) * fraction
                                          val dx = (longitude - sampleLongitude) * 111.0 * kotlin.math.cos(Math.toRadians(latitude))
                                          val dy = (latitude - sampleLatitude) * 111.0
                                          val distanceKm = kotlin.math.sqrt(dx * dx + dy * dy)
                                          if (distanceKm < nearestDistanceKm) {
                                              nearestDistanceKm = distanceKm
                                              nearestFraction = fraction
                                          }
                                      }
                                  }
                                  val distanceLabel = if (nearestDistanceKm < Double.MAX_VALUE) " — približne " + String.format(java.util.Locale.getDefault(), "%.1f", nearestDistanceKm) + " km od kontrolného bodu" else ""
                                  val progressLabel = routeRoadKm?.let { " — približne " + String.format(java.util.Locale.getDefault(), "%.0f", it * nearestFraction) + " km od začiatku trasy" } ?: ""
                                  val fuel = listOf("diesel" to "nafta", "octane_95" to "benzín 95", "octane_98" to "benzín 98").mapNotNull { (key, label) -> if (tags.optString(key).equals("yes", true)) label else null }
                                  rows.add(Pair(nearestFraction, "• " + name + (brand?.let { " (" + it + ")" } ?: "") + distanceLabel + progressLabel + (if (fuel.isNotEmpty()) " — " + fuel.joinToString(", ") else "")))
                              }
                              fuelStationsText = if (rows.isEmpty()) "V okolí trasy sa nenašli stanice v mapových údajoch." else "Čerpacie stanice pozdĺž orientačného koridoru (vzdialenosti a poradie sú približné; ceny paliva zatiaľ nie sú dostupné):\\n" + rows.sortedBy { it.first }.take(20).joinToString("\\n") { it.second }
                          } catch (e: Exception) {
                              fuelStationsText = "Stanice sa nepodarilo načítať: " + (e.message ?: "skontroluj internet")
                          } finally {
                              findingFuelStations = false
                          }
                      }
                  },
                  modifier = Modifier.fillMaxWidth()
              ) { Text(if (findingFuelStations) "Hľadám stanice…" else "Nájsť čerpacie stanice") }
              if (fuelStationsText.isNotBlank()) {
                  Surface(color = MaterialTheme.colorScheme.secondaryContainer, shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth()) {
                      Text(fuelStationsText, modifier = Modifier.padding(12.dp), fontSize = 14.sp)
                  }
              }'''
          if "Nájsť čerpacie stanice" not in s:
              s = s[:ui_match.start()] + ui + s[ui_match.end():]
          p.write_text(s)
          print("Added OpenStreetMap/Overpass nearby fuel-station search; prices are explicitly not fabricated.")
          PY

