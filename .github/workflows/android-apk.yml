name: Build OLI RouteSave Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "OLI_RouteSave_Android_FINAL_PROJECT_44_00.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Android project archive
        run: |
          test -f OLI_RouteSave_Android_FINAL_PROJECT_44_00.zip || {
            echo "Android project ZIP is missing from the repository root."
            exit 1
          }

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q OLI_RouteSave_Android_FINAL_PROJECT_44_00.zip -d android-project
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts

      - name: Inspect home screen branding for safe patching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-project/app/src/main/java/com/oli/routesave/ui/compose/RouteSaveComposeApp.kt")
          lines = p.read_text().splitlines()
          needles = ("OLI", "RouteSave", "HomeScreen", "CircleShape", "Tvoje vozidlo")
          hits = [i for i, line in enumerate(lines) if any(n in line for n in needles)]
          shown = set()
          for i in hits:
              start, end = max(0, i-5), min(len(lines), i+7)
              if any(j in shown for j in range(start, end)):
                  continue
              shown.update(range(start, end))
              print(f"--- {p}:{start+1}-{end} ---")
              for j in range(start, end):
                  print(f"{j+1}: {lines[j]}")
          PY

      - name: Apply source compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("android-project/app/src/main/java/com/oli/routesave")

          def replace(path, old, new, count=1):
              p = root / path
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected text not found in {path}: {old[:90]!r}")
              p.write_text(s.replace(old, new, count))

          replace(Path("android/runtime/DriveRuntimeBridge.kt"), "import com.oli.routesave.voice.runtime.UnifiedVoiceRuntime", "import com.oli.routesave.voice.runtime.UnifiedVoiceRuntime\nimport com.oli.routesave.voice.runtime.UnifiedVoiceEventType")
          replace(Path("android/runtime/DriveRuntimeBridge.kt"), "voiceRuntime.reset()", "voiceRuntime.interrupt(UnifiedVoiceEventType.SESSION_TIMEOUT)")
          replace(Path("communication/ContactAliasCallResolver.kt"), "aliasRepository.findByAlias(cleaned)", "aliasRepository.find(cleaned)")
          replace(Path("communication/ContactAliasCallResolver.kt"), "\ndata class ContactCandidate(\n    val contactId: String,\n    val displayName: String\n)\n", "\n")
          replace(Path("communication/SharedPreferencesContactAliasRepository.kt"), "override suspend fun saveAlias(alias: ContactAlias)", "override suspend fun save(alias: ContactAlias)")
          replace(Path("communication/SharedPreferencesContactAliasRepository.kt"), "override suspend fun findByAlias(alias: String)", "override suspend fun find(alias: String)")
          replace(Path("communication/SharedPreferencesContactAliasRepository.kt"), "override suspend fun removeAlias(alias: String): Boolean", "override suspend fun remove(alias: String)")
          replace(Path("communication/SharedPreferencesContactAliasRepository.kt"), "if (normalized.isEmpty()) return false", "if (normalized.isEmpty()) return")
          replace(Path("communication/SharedPreferencesContactAliasRepository.kt"), "if (!preferences.contains(key)) return false", "if (!preferences.contains(key)) return")
          replace(Path("communication/SharedPreferencesContactAliasRepository.kt"), "return true\n        }\n    }\n\n    override suspend fun allAliases()", "return\n        }\n    }\n\n    override suspend fun allAliases()")
          replace(Path("communication/AndroidContactPermissionState.kt"), "    val phoneNumbers: List<ContactPhoneNumber>\n", "    val phoneNumbers: List<ContactPhoneNumber> = emptyList()\n")
          replace(Path("ui/RouteSaveHomeController.kt"), "profile?.displayName ?: \"Nikolas\"", "profile?.displayName() ?: \"Nikolas\"")
          compose = root / "ui/compose/RouteSaveComposeApp.kt"
          s = compose.read_text()
          imports = [
              "import android.content.Intent",
              "import android.speech.RecognizerIntent",
              "import android.speech.tts.TextToSpeech",
              "import android.widget.Toast",
              "import androidx.activity.compose.rememberLauncherForActivityResult",
              "import androidx.activity.result.contract.ActivityResultContracts",
              "import androidx.compose.runtime.DisposableEffect",
              "import androidx.compose.foundation.layout.PaddingValues",
              "import androidx.compose.material3.LinearProgressIndicator",
              "import androidx.compose.material.icons.filled.RecordVoiceOver",
              "import androidx.compose.material.icons.filled.VerifiedUser",
              "import androidx.compose.material.icons.filled.Search",
              "import androidx.compose.material.icons.filled.Stop",
              "import androidx.compose.material.icons.filled.VolumeOff",
              "import com.oli.routesave.travel.TravelMode",
              "import androidx.compose.runtime.rememberCoroutineScope",
              "import androidx.compose.runtime.LaunchedEffect",
              "import kotlinx.coroutines.delay",
              "import kotlinx.coroutines.Dispatchers",
              "import kotlinx.coroutines.launch",
              "import kotlinx.coroutines.withContext",
              "import org.json.JSONObject",
              "import java.net.URL",
              "import java.net.URLEncoder",
          ]
          marker = "package com.oli.routesave.ui.compose\n"
          s = s.replace(marker, marker + "\n" + "\n".join(imports) + "\n", 1)

          voice_setup = r"""
              val nikoSpeechLauncher = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                  val phrase = result.data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull().orEmpty()
                  if (result.resultCode == Activity.RESULT_OK && phrase.isNotBlank()) {
                      Toast.makeText(context, "Niko počul: $phrase", Toast.LENGTH_LONG).show()
                      val tts = TextToSpeech(context) { status ->
                          if (status == TextToSpeech.SUCCESS) {
                              tts.setLanguage(java.util.Locale("sk", "SK"))
                              tts.speak("Počul som: $phrase", TextToSpeech.QUEUE_FLUSH, null, "niko-response")
                          }
                      }
                  } else {
                      Toast.makeText(context, "Niko nezachytil reč. Skús to znova.", Toast.LENGTH_LONG).show()
                  }
                  assistantListening = false
              }
              fun startNikoSpeech() {
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "sk-SK")
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "sk-SK")
                      putExtra(RecognizerIntent.EXTRA_PROMPT, "Niko počúva. Povedz niečo po slovensky.")
                      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                  }
                  try {
                      assistantListening = true
                      nikoSpeechLauncher.launch(intent)
                  } catch (e: Exception) {
                      assistantListening = false
                      Toast.makeText(context, "Rozpoznávanie reči nie je dostupné.", Toast.LENGTH_LONG).show()
                  }
              }
          """
          composable_anchor = "    val context = LocalContext.current"
          if composable_anchor not in s:
              raise SystemExit("Could not locate app context for voice setup.")
          if "val nikoSpeechLauncher =" not in s:
              s = s.replace(composable_anchor, composable_anchor + "\n" + voice_setup, 1)
          s = s.replace("onAssistantClick = { assistantListening = !assistantListening }", "onAssistantClick = { startNikoSpeech() }")
          s = s.replace("onAssistantClick = { assistantListening = !assistantListening }", "onAssistantClick = { startNikoSpeech() }")
          s = s.replace("                        vehicleRepository = vehicleRepository,\n                        assistantListening", "                        vehicleRepository = vehicleRepository,\n                        tripHistoryService = tripHistoryService,\n                        assistantListening", 1)
          s = s.replace("private fun HomeScreen(\n    vehicleRepository: VehicleRepository,", "private fun HomeScreen(\n    vehicleRepository: VehicleRepository,\n    tripHistoryService: TripHistoryService,", 1)
          # Locate the calculator wherever it is defined in the Android project.
          project = Path("android-project")
          calculator_file = None
          calculator_source = None
          for candidate in project.glob("app/src/main/java/**/*.kt"):
              candidate_source = candidate.read_text()
              if "TripCostQuickCalculator" in candidate_source and "distanceText" in candidate_source:
                  calculator_file, calculator_source = candidate, candidate_source
                  break
          if calculator_file is None:
              raise SystemExit("Could not safely locate the trip calculator source.")
          calculator_pattern = re.compile(r'(@Composable\s+(?:private\s+)?fun\s+TripCostQuickCalculator\s*\([^)]*\)\s*\{)', re.S)
          match = calculator_pattern.search(calculator_source)
          if not match:
              raise SystemExit("Calculator declaration not found; refusing an unsafe patch.")
          if "last_distance_km" not in calculator_source:
              calculator_source = calculator_source[:match.end()] + '\n    val routeContext = androidx.compose.ui.platform.LocalContext.current' + calculator_source[match.end():]
          new_distance_state = '''var distanceText by rememberSaveable { mutableStateOf("") }
          val routePreferences = routeContext.getSharedPreferences("oli_routesave_route", android.content.Context.MODE_PRIVATE)
          androidx.compose.runtime.DisposableEffect(routePreferences) {
              fun refreshRouteDistance() {
                  val savedKm = routePreferences.getFloat("last_distance_km", 0f)
                  if (savedKm > 0f) {
                      val formattedKm = String.format(java.util.Locale.getDefault(), "%.1f", savedKm)
                      if (distanceText != formattedKm) distanceText = formattedKm
                  }
              }
              val routePreferenceListener = android.content.SharedPreferences.OnSharedPreferenceChangeListener { _, key ->
                  if (key == "last_distance_km") refreshRouteDistance()
              }
              routePreferences.registerOnSharedPreferenceChangeListener(routePreferenceListener)
              refreshRouteDistance()
              onDispose { routePreferences.unregisterOnSharedPreferenceChangeListener(routePreferenceListener) }
          }'''
          state_patterns = [
              'var distanceText by rememberSaveable { mutableStateOf("") }',
              'var distanceText by rememberSaveable { mutableStateOf("100") }',
          ]
          patched_state = False
          for state_pattern in state_patterns:
              if state_pattern in calculator_source:
                  calculator_source = calculator_source.replace(state_pattern, new_distance_state, 1)
                  patched_state = True
                  break
          if not patched_state and "routeLifecycleOwner" not in calculator_source:
              raise SystemExit("Calculator distance state has an unexpected form; refusing an unsafe patch.")
          # Add a real road-distance lookup to the quick calculator. Geocode both
          # locations with Nominatim, then use OSRM's driving route distance.
          calculator_marker = '    var originText by rememberSaveable { mutableStateOf("") }'
          calculator_add = """    val calculatorScope = rememberCoroutineScope()
              var routeLookupLoading by rememberSaveable { mutableStateOf(false) }
              var routeLookupMessage by rememberSaveable { mutableStateOf("") }
              suspend fun findRoadDistanceKm(start: String, end: String): Double = withContext(Dispatchers.IO) {
                  fun geocode(place: String): Pair<Double, Double> {
                      val encoded = URLEncoder.encode(place, "UTF-8")
                      val connection = URL("https://nominatim.openstreetmap.org/search?q=$encoded&format=json&limit=1").openConnection() as java.net.HttpURLConnection
                      connection.connectTimeout = 10000
                      connection.readTimeout = 12000
                      connection.setRequestProperty("User-Agent", "OLI-RouteSave/1.0 (route distance lookup)")
                      try {
                          val body = connection.inputStream.bufferedReader().use { it.readText() }
                          val results = org.json.JSONArray(body)
                          if (results.length() == 0) throw IllegalArgumentException("Miesto sa nenašlo: $place")
                          val item = results.getJSONObject(0)
                          Pair(item.getString("lon").toDouble(), item.getString("lat").toDouble())
                      } finally { connection.disconnect() }
                  }
                  val a = geocode(start)
                  val b = geocode(end)
                  val routeUrl = "https://routing.openstreetmap.de/routed-car/route/v1/driving/" + a.first + "," + a.second + ";" + b.first + "," + b.second + "?overview=false"
                  val connection = URL(routeUrl).openConnection() as java.net.HttpURLConnection
                  connection.connectTimeout = 10000
                  connection.readTimeout = 15000
                  connection.setRequestProperty("User-Agent", "OLI-RouteSave/1.0 (Android route distance lookup)")
                  connection.setRequestProperty("Accept", "application/json")
                  try {
                      val body = connection.inputStream.bufferedReader().use { it.readText() }
                      val root = JSONObject(body)
                      if (root.optString("code") != "Ok") throw IllegalArgumentException("Cestu sa nepodarilo vypočítať.")
                      val routes = root.getJSONArray("routes")
                      if (routes.length() == 0) throw IllegalArgumentException("Pre tieto miesta sa nenašla cesta.")
                      routes.getJSONObject(0).getDouble("distance") / 1000.0
                  } finally { connection.disconnect() }
              }
          """
          if calculator_marker not in calculator_source:
              raise SystemExit("Could not locate calculator input section for road-distance lookup.")
          if "findRoadDistanceKm" not in calculator_source:
              calculator_source = calculator_source.replace(calculator_marker, calculator_add + calculator_marker, 1)
          distance_field_pos = calculator_source.find("value = distanceText,")
          if distance_field_pos < 0:
              raise SystemExit("Could not locate distance field to insert route button.")
          calculator_ui_start = calculator_source.rfind("OutlinedTextField(", 0, distance_field_pos)
          if calculator_ui_start < 0:
              raise SystemExit("Could not locate distance field declaration.")
          calculator_ui = '''            Button(
                  enabled = !routeLookupLoading && originText.isNotBlank() && destinationText.isNotBlank(),
                  onClick = {
                      calculatorScope.launch {
                          routeLookupLoading = true
                          routeLookupMessage = "Počítam cestnú vzdialenosť…"
                          try {
                              val km = findRoadDistanceKm(originText.trim(), destinationText.trim())
                              distanceText = String.format(java.util.Locale.US, "%.1f", km)
                              routeLookupMessage = "Vypočítaná cestná vzdialenosť: %.1f km".format(java.util.Locale.getDefault(), km)
                              resultText = ""
                              lastSavedEstimate = null
                              saveMessage = ""
                          } catch (e: Exception) {
                              routeLookupMessage = "Vzdialenosť sa nepodarilo vypočítať. Skontroluj názvy miest a internet."
                          } finally {
                              routeLookupLoading = false
                          }
                      }
                  },
                  modifier = Modifier.fillMaxWidth()
              ) {
                  Text(if (routeLookupLoading) "Počítam trasu…" else "Vypočítať kilometre")
              }
              if (routeLookupMessage.isNotBlank()) {
                  Text(routeLookupMessage, color = MaterialTheme.colorScheme.onSurfaceVariant, fontSize = 12.sp)
              }'''
          if "Vypočítať kilometre" not in calculator_source:
              calculator_source = calculator_source[:calculator_ui_start] + calculator_ui + calculator_source[calculator_ui_start:]
          # Ensure imports and HomeScreen wiring are applied to the same source version
          # that receives the calculator edits.
          required_imports = [
              "import androidx.compose.runtime.DisposableEffect",
              "import androidx.compose.foundation.layout.PaddingValues",
              "import androidx.compose.material3.LinearProgressIndicator",
              "import androidx.compose.material.icons.filled.RecordVoiceOver",
              "import androidx.compose.material.icons.filled.VerifiedUser",
              "import androidx.compose.material.icons.filled.Search",
              "import androidx.compose.material.icons.filled.Stop",
              "import androidx.compose.material.icons.filled.VolumeOff",
              "import com.oli.routesave.travel.TravelMode",
              "import androidx.compose.runtime.rememberCoroutineScope",
              "import androidx.compose.runtime.LaunchedEffect",
              "import kotlinx.coroutines.delay",
              "import kotlinx.coroutines.Dispatchers",
              "import kotlinx.coroutines.launch",
              "import kotlinx.coroutines.withContext",
              "import org.json.JSONObject",
              "import java.net.URL",
              "import java.net.URLEncoder",
          ]
          package_line = "package com.oli.routesave.ui.compose\n"
          for imp in required_imports:
              if imp not in calculator_source:
                  calculator_source = calculator_source.replace(package_line, package_line + imp + "\n", 1)
          calculator_source = calculator_source.replace(
              "private fun HomeScreen(\n    vehicleRepository: VehicleRepository,",
              "private fun HomeScreen(\n    vehicleRepository: VehicleRepository,\n    tripHistoryService: TripHistoryService,", 1
          )
          # The button string already contains the next field's opening; do not duplicate it.
          calculator_source = calculator_source.replace(
              'Text(routeLookupMessage, color = MaterialTheme.colorScheme.onSurfaceVariant, fontSize = 12.sp)\n              }\n              OutlinedTextField(\n                  value = distanceText,',
              'Text(routeLookupMessage, color = MaterialTheme.colorScheme.onSurfaceVariant, fontSize = 12.sp)\n              }',
              1
          )
          # Automatically recalculate after both places are entered; debounce typing and clear stale distance.
          if "AUTO_ROUTE_DISTANCE_EFFECT" not in calculator_source:
              destination_pattern = re.compile(r'(^[ \t]*var destinationText by rememberSaveable \{ mutableStateOf\("[^"]*"\) \})', re.M)
              destination_match = destination_pattern.search(calculator_source)
              if not destination_match:
                  raise SystemExit("Could not safely locate destination field state for automatic route calculation.")
              auto_effect = '''
          // AUTO_ROUTE_DISTANCE_EFFECT: debounce place entry and never keep stale kilometres.
          LaunchedEffect(originText, destinationText) {
              if (originText.isBlank() || destinationText.isBlank()) {
                  distanceText = ""
                  routeLookupMessage = ""
                  return@LaunchedEffect
              }
              distanceText = ""
              routeLookupMessage = "Vyhľadávam trasu…"
              delay(1200)
              routeLookupLoading = true
              try {
                  val km = findRoadDistanceKm(originText.trim(), destinationText.trim())
                  distanceText = String.format(java.util.Locale.US, "%.1f", km)
                  routeLookupMessage = "Vypočítaná cestná vzdialenosť: %.1f km".format(java.util.Locale.getDefault(), km)
              } catch (e: Exception) {
                  distanceText = ""
                  routeLookupMessage = "Vzdialenosť sa nepodarilo vypočítať. Skontroluj názvy miest a internet."
              } finally {
                  routeLookupLoading = false
              }
          }
          '''
              calculator_source = calculator_source[:destination_match.end()] + auto_effect + calculator_source[destination_match.end():]
          calculator_file.write_text(calculator_source)
          print(f"Connected saved route distance and road lookup to calculator source: {calculator_file}")
          print("--- CALCULATOR FUNCTION SOURCE FOR TARGETED DISTANCE FIX ---")
          calculator_lines = calculator_source.splitlines()
          for i, line in enumerate(calculator_lines):
              if "TripCostQuickCalculator" in line:
                  for j in range(max(0, i-3), min(len(calculator_lines), i+180)):
                      print(f"{j+1}: {calculator_lines[j]}")
                  break

          # Never prefill a fake 100 km distance: until a real route provider returns
          # road distance, require the user to enter a measured distance explicitly.
          s = s.replace('var distanceText by rememberSaveable { mutableStateOf("100") }', 'var distanceText by rememberSaveable { mutableStateOf("") }', 1)
          compose.write_text(s)
          # Re-apply the calculator edits after the legacy `s` write above; otherwise
          # the stale pre-patch source overwrites the new kilometre button and lookup.
          calculator_file.write_text(calculator_source)

          # The notification-listener service is not needed for the current MVP
          # and can trigger Google Play Protect's sideloading block. Keep it out
          # until its purpose, disclosure, and user-consent flow are reviewed.
          manifest = root.parents[3] / "AndroidManifest.xml"
          manifest_text = manifest.read_text()
          if "android.permission.INTERNET" not in manifest_text:
              if 'xmlns:android=' not in manifest_text:
                  manifest_text = manifest_text.replace("<manifest", '<manifest xmlns:android="http://schemas.android.com/apk/res/android"', 1)
              manifest_text = manifest_text.replace("<application", '    <uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          manifest.write_text(manifest_text.replace(
              '    <service\n            android:name="com.oli.routesave.messaging.RouteSaveNotificationListenerService"\n            android:label="OLI RouteSave – správy"\n            android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.service.notification.NotificationListenerService" />\n            </intent-filter>\n        </service>\n',
              ''
          ))
          p = root / "voice/assistant/VoiceAssistantSettingsController.kt"
          s = p.read_text().replace("AssistantProfileCatalog.all()", "AssistantProfileCatalog.all")
          p.write_text(s)

          # Fix the crash when tapping "Pridať vozidlo": selectedTab becomes
          # "Vehicle", which is not a member of AppTab. valueOf() crashed before
          # the VehicleProfileScreen could render.
          compose = root / "ui/compose/RouteSaveComposeApp.kt"
          s = compose.read_text()
          old = "                when (AppTab.valueOf(selectedTab)) {"
          if old not in s:
              raise SystemExit("Expected navigation dispatch not found; refusing to build an unpatched app.")
          s = s.replace(old, "                when (selectedTab) {", 1)
          for tab in ("Home", "Route", "Drive", "Community", "More"):
              s = s.replace(f"AppTab.{tab} ->", f"AppTab.{tab}.name ->", 1)
          old_end = "                    )\n                }\n                // Lightweight destinations accessible from More."
          new_end = "                    )\n                    else -> Unit // Subscreens such as Vehicle are rendered below.\n                }\n                // Lightweight destinations accessible from More."
          if old_end not in s:
              raise SystemExit("Expected end of navigation dispatch not found; refusing to build an unpatched app.")
          s = s.replace(old_end, new_end, 1)
          # Wire the Settings action to a screen instead of an empty destination.
          anchor = '                    when (selectedTab) {\n                        "Vehicle" -> VehicleProfileScreen('
          if anchor not in s:
              raise SystemExit("Settings destination insertion point not found.")
          s = s.replace(anchor, '                    when (selectedTab) {\n                        "Settings" -> BasicSettingsScreen(onBack = { selectedTab = AppTab.More.name })\n                        "Vehicle" -> VehicleProfileScreen(', 1)
          s = s.rstrip() + '''
          
          @Composable
          private fun BasicSettingsScreen(onBack: () -> Unit) {
              Column(
                  modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  OutlinedButton(onClick = onBack) {
                      Icon(Icons.Filled.ArrowBack, contentDescription = null)
                      Text("Späť")
                  }
                  Text("Nastavenia", style = MaterialTheme.typography.headlineMedium)
                  Text("OLI RouteSave", style = MaterialTheme.typography.titleMedium)
                  Text("Save money. Travel smarter.", color = MaterialTheme.colorScheme.onSurfaceVariant)
                  Text("Hlasového asistenta a jeho jazyk upravíš v časti Viac → Asistent.")
                  Text("Pred telefonátom, odoslaním SMS alebo zdieľaním polohy musí aplikácia vždy vyžiadať tvoje jasné potvrdenie.", color = MaterialTheme.colorScheme.onSurfaceVariant)
              }
          }
                    '''
          compose.write_text(s)
          print("Applied compatibility fixes, repaired Vehicle navigation and added a Settings screen.")
          PY

      - name: Repair legacy vehicle profile test type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-project/app/src/test/java/com/oli/routesave/ui/VehicleProfileControllerTest.kt")
          if p.exists():
              s = p.read_text()
              # The legacy fixture passed an Int to a Double consumption field.
              # Convert integer literals only when used as named consumption values.
              import re
              s2 = re.sub(r'(?<![.\d])(-?\d+)(?=\s*,\s*1\.5\s*,\s*true)', r'\1.0', s)
              s2 = re.sub(r',\s*(-?\d+)\s*,', lambda m: ', ' + m.group(1) + '.0,' if '.' not in m.group(1) else m.group(0), s2)
              if s2 != s:
                  p.write_text(s2)
                  print("Corrected integer consumption fixture to Double.")
              else:
                  print("No named integer consumption literal found; showing test source for exact repair.")
              print("\n".join(s.splitlines()[:15]))
          else:
              print("VehicleProfileControllerTest.kt not found.")
          PY

      - name: Ensure unit-test dependencies are available
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-project/app/build.gradle.kts")
          s = p.read_text()
          marker = "dependencies {"
          if marker not in s:
              raise SystemExit("Could not find app dependencies block for test dependencies.")
          required = [
              '    testImplementation(kotlin("test"))',
              '    testImplementation("junit:junit:4.13.2")',
              '    testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0")',
          ]
          missing = [line for line in required if line not in s]
          if missing:
              s = s.replace(marker, marker + "\n" + "\n".join(missing), 1)
              p.write_text(s)
          print("Verified Kotlin/JUnit/coroutines test dependencies.")
          PY

      - name: Inspect navigation and settings handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-project/app/src/main/java/com/oli/routesave/ui/compose/RouteSaveComposeApp.kt")
          lines = p.read_text().splitlines()
          for start, end in ((175, 300), (1180, 1350), (1350, 1530)):
              print(f"--- SOURCE LINES {start}-{min(end, len(lines))} ---")
              for i in range(start-1, min(end, len(lines))):
