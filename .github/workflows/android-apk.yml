      - name: Publish APK as a downloadable GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="android-project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          tag="test-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --title "OLI RouteSave test build ${GITHUB_RUN_NUMBER}" --notes "Automated test APK. Install for testing only; not a production release."

