name: Build OLI RouteSave Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "OLI_RouteSave_Android_FINAL_PROJECT_44_00.zip"
      - ".github/workflows/android-apk.yml"
      - "scripts/patch-route-screen.py"

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Android project archive
        run: |
          test -f OLI_RouteSave_Android_FINAL_PROJECT_44_00.zip || {
            echo "Android project ZIP is missing from the repository root."
            exit 1
          }

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q OLI_RouteSave_Android_FINAL_PROJECT_44_00.zip -d android-project
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts

      - name: Inspect home screen branding for safe patching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-project/app/src/main/java/com/oli/routesave/ui/compose/RouteSaveComposeApp.kt")
          lines = p.read_text().splitlines()
          needles = ("OLI", "RouteSave", "HomeScreen", "CircleShape", "Tvoje vozidlo")
          hits = [i for i, line in enumerate(lines) if any(n in line for n in needles)]
          shown = set()
          for i in hits:
              start, end = max(0, i-5), min(len(lines), i+7)
              if any(j in shown for j in range(start, end)):
                  continue
              shown.update(range(start, end))
              print(f"--- {p}:{start+1}-{end} ---")
              for j in range(start, end):
                  print(f"{j+1}: {lines[j]}")
          PY

      - name: Apply source compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("android-project/app/src/main/java/com/oli/routesave")

          def replace(path, old, new, count=1):
              p = root / path
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected text not found in {path}: {old[:90]!r}")
              p.write_text(s.replace(old, new, count))

          replace(Path("android/runtime/DriveRuntimeBridge.kt"), "import com.oli.routesave.voice.runtime.UnifiedVoiceRuntime", "import com.oli.routesave.voice.runtime.UnifiedVoiceRuntime\nimport com.oli.routesave.voice.runtime.UnifiedVoiceEventType")
          replace(Path("android/runtime/DriveRuntimeBridge.kt"), "voiceRuntime.reset()", "voiceRuntime.interrupt(UnifiedVoiceEventType.SESSION_TIMEOUT)")
          replace(Path("communication/ContactAliasCallResolver.kt"), "aliasRepository.findByAlias(cleaned)", "aliasRepository.find(cleaned)")
          replace(Path("communication/ContactAliasCallResolver.kt"), "\ndata class ContactCandidate(\n    val contactId: String,\n    val displayName: String\n)\n", "\n")
          replace(Path("communication/SharedPreferencesContactAliasRepository.kt"), "override suspend fun saveAlias(alias: ContactAlias)", "override suspend fun save(alias: ContactAlias)")
          replace(Path("communication/SharedPreferencesContactAliasRepository.kt"), "override suspend fun findByAlias(alias: String)", "override suspend fun find(alias: String)")
          replace(Path("communication/SharedPreferencesContactAliasRepository.kt"), "override suspend fun removeAlias(alias: String): Boolean", "override suspend fun remove(alias: String)")
          replace(Path("communication/SharedPreferencesContactAliasRepository.kt"), "if (normalized.isEmpty()) return false", "if (normalized.isEmpty()) return")
          replace(Path("communication/SharedPreferencesContactAliasRepository.kt"), "if (!preferences.contains(key)) return false", "if (!preferences.contains(key)) return")
          replace(Path("communication/SharedPreferencesContactAliasRepository.kt"), "return true\n        }\n    }\n\n    override suspend fun allAliases()", "return\n        }\n    }\n\n    override suspend fun allAliases()")
          replace(Path("communication/AndroidContactPermissionState.kt"), "    val phoneNumbers: List<ContactPhoneNumber>\n", "    val phoneNumbers: List<ContactPhoneNumber> = emptyList()\n")
          replace(Path("ui/RouteSaveHomeController.kt"), "profile?.displayName ?: \"Nikolas\"", "profile?.displayName() ?: \"Nikolas\"")
          compose = root / "ui/compose/RouteSaveComposeApp.kt"
          s = compose.read_text()
          imports = [
              "import android.content.Intent",
              "import android.speech.RecognizerIntent",
              "import android.speech.tts.TextToSpeech",
              "import android.speech.tts.UtteranceProgressListener",
              "import android.widget.Toast",
              "import androidx.activity.compose.rememberLauncherForActivityResult",
              "import androidx.activity.result.contract.ActivityResultContracts",
              "import androidx.compose.runtime.DisposableEffect",
              "import androidx.compose.foundation.layout.PaddingValues",
              "import androidx.compose.material3.LinearProgressIndicator",
              "import androidx.compose.material.icons.filled.RecordVoiceOver",
              "import androidx.compose.material.icons.filled.VerifiedUser",
              "import androidx.compose.material.icons.filled.Search",
              "import androidx.compose.material.icons.filled.Stop",
              "import androidx.compose.material.icons.filled.VolumeOff",
              "import com.oli.routesave.travel.TravelMode",
              "import androidx.compose.runtime.rememberCoroutineScope",
              "import androidx.compose.runtime.LaunchedEffect",
              "import kotlinx.coroutines.delay",
              "import kotlinx.coroutines.Dispatchers",
              "import kotlinx.coroutines.launch",
              "import kotlinx.coroutines.withContext",
              "import org.json.JSONObject",
              "import java.net.URL",
              "import java.net.URLEncoder",
              "import android.speech.SpeechRecognizer",
              "import android.speech.RecognitionListener",
              "import android.os.Bundle",
              "import android.os.Handler",
              "import android.os.Looper",
          ]
          marker = "package com.oli.routesave.ui.compose\n"
          existing_imports = set(re.findall(r"^import [^\n]+", s, re.M))
          missing_imports = [imp for imp in imports if imp not in existing_imports]
          s = s.replace(marker, marker + "\n" + "\n".join(missing_imports) + "\n", 1)
          if "import android.app.Activity" not in s:
              s = s.replace(marker, marker + "import android.app.Activity\n", 1)

          voice_setup = r"""
              val nikoTtsReady = remember { mutableStateOf(false) }
              val nikoPendingSpeech = remember { mutableStateOf("") }
              val nikoHandsFreeMode = remember { mutableStateOf(false) }
              val nikoWelcomeSpoken = remember { mutableStateOf(false) }
              val nikoListenAgain = remember { mutableStateOf(false) }
              val nikoTtsStatus = remember { mutableStateOf("Pripravujem hlas…") }
              val nikoTtsEngine = remember(context) {
                  TextToSpeech(context.applicationContext) { status ->
                      nikoTtsReady.value = status == TextToSpeech.SUCCESS
                      nikoTtsStatus.value = if (status == TextToSpeech.SUCCESS) "Hlas pripravený" else "Hlasová služba nie je dostupná"
                  }
              }
              DisposableEffect(nikoTtsEngine) {
                  onDispose {
                      nikoTtsEngine.stop()
                      nikoTtsEngine.shutdown()
                  }
              }
              LaunchedEffect(nikoTtsReady.value, nikoPendingSpeech.value) {
                  val pending = nikoPendingSpeech.value
                  if (nikoTtsReady.value && pending.isNotBlank()) {
                      val slovakLocale = java.util.Locale("sk", "SK")
                      val languageResult = nikoTtsEngine.setLanguage(slovakLocale)
                      if (languageResult == TextToSpeech.LANG_MISSING_DATA || languageResult == TextToSpeech.LANG_NOT_SUPPORTED) {
                          nikoTtsStatus.value = "Chýba slovenský hlas v telefóne"
                          Toast.makeText(context, "V telefóne chýba slovenský hlas. Otvor nastavenia Text-to-Speech a nainštaluj slovenské hlasové údaje.", Toast.LENGTH_LONG).show()
                      } else {
                          nikoTtsEngine.setSpeechRate(0.92f)
                          nikoTtsEngine.setPitch(0.82f)
                          nikoTtsEngine.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {}
                              override fun onDone(utteranceId: String?) {
                                  android.os.Handler(android.os.Looper.getMainLooper()).post {
                                      if (nikoHandsFreeMode.value) nikoListenAgain.value = true
                                  }
                              }
                              override fun onError(utteranceId: String?) {
                                  android.os.Handler(android.os.Looper.getMainLooper()).post { nikoListenAgain.value = false }
                              }
                          })
                          nikoListenAgain.value = false
                          val result = nikoTtsEngine.speak(pending, TextToSpeech.QUEUE_FLUSH, null, "niko-response")
                          nikoTtsStatus.value = if (result == TextToSpeech.SUCCESS) "Niko hovorí…" else "Hlas sa nepodarilo spustiť"
                          if (result != TextToSpeech.SUCCESS) {
                              Toast.makeText(context, "Niko nemôže spustiť hlas. Skontroluj hlasový výstup v nastaveniach telefónu.", Toast.LENGTH_LONG).show()
                          }
                      }
                      nikoPendingSpeech.value = ""
                  }
              }
              val nikoSpeechLauncherForHome = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                  val phrase = result.data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull().orEmpty().trim()
                  if (result.resultCode == Activity.RESULT_OK && phrase.isNotBlank()) {
                      val normalizedRaw = java.text.Normalizer.normalize(phrase.lowercase(java.util.Locale("sk", "SK")), java.text.Normalizer.Form.NFD)
                          .replace(Regex("\\p{Mn}+"), "")
                      // Android speech recognition may return Slovak numbers as words (for example "tromi").
                      val normalized = normalizedRaw
                          .replace(Regex("\\b(jeden|jedna|jedno)\\b"), "1")
                          .replace(Regex("\\b(dva|dve)\\b"), "2")
                          .replace(Regex("\\b(tri|troch|tromi)\\b"), "3")
                          .replace(Regex("\\b(styri|styroch)\\b"), "4")
                          .replace(Regex("\\b(pat|piatich)\\b"), "5")
                          .replace(Regex("\\b(sest|siestich)\\b"), "6")
                          .replace(Regex("\\b(sedem)\\b"), "7")
                          .replace(Regex("\\b(osem)\\b"), "8")
                          .replace(Regex("\\b(devat)\\b"), "9")
                      val answer = when {
                          normalized.trim().matches(Regex("^(niko|niko prosim|hej niko|hal[oó] niko)$")) ->
                              "Som tu. Hovor, počúvam ťa."
                          listOf("pomoc", "co vies", "co dokazes", "prikazy").any { normalized.contains(it) } ->
                              "Som Niko, tvoj hlasovy asistent. Mozes sa ma opytat na trasu, spotrebu paliva alebo udaje o vozidle."
                          listOf("palivo", "spotreba", "cena cesty", "naklady").any { normalized.contains(it) } ->
                              "Na vypocet nakladov potrebujem trasu a priemernu spotrebu vozidla. Skontroluj tieto udaje v kalkulacke cesty."
                          listOf("trasa", "navig", "kilomet", "vzdialen").any { normalized.contains(it) } ->
                              "Pri planovani trasy zadaj miesto odchodu a ciel. Vzdialenost sa ma pocitat podla cestnej trasy."
                          listOf("vozidlo", "auto", "kamion").any { normalized.contains(it) } ->
                              "Udaje o vozidle a jeho spotrebe najdes v profile vozidla."
                          listOf("ahoj", "cau", "dobry den", "dobre rano", "dobry vecer").any { normalized.contains(it) } ->
                              "Ahoj! Mam sa dobre, dakujem. Co by si dnes potreboval?"
                          listOf("ako sa mas", "mas sa", "ako sa ti dari").any { normalized.contains(it) } ->
                              "Mam sa dobre, dakujem, ze sa pytas. A ako sa mas ty?"
                          listOf("dakujem", "vdaka").any { normalized.contains(it) } ->
                              "Rado sa stalo. Som tu, ked ma budes potrebovat."
                          normalized.matches(Regex(".*\\bkolko je\\b.*")) && Regex("\\d+").findAll(normalized).count() >= 2 ->
                              run {
                                  val numbers = Regex("\\d+").findAll(normalized).map { it.value.toLongOrNull() }.filterNotNull().take(2).toList()
                                  when {
                                      numbers.size < 2 -> "Povedz mi, prosim, priklad este raz."
                                      listOf("delen", "delit", "delene", "deleno", "delenie").any { normalized.contains(it) } -> if (numbers[1] == 0L) "Nulou sa delit neda." else "Vysledok je ${numbers[0].toDouble() / numbers[1].toDouble()}."
                                      listOf("krat", "nasob", "nasobenie", "vynasob", "kratit").any { normalized.contains(it) } || Regex("\\b[x×]\\b").containsMatchIn(normalized) -> "Vysledok je ${numbers[0] * numbers[1]}."
                                      normalized.contains("plus") || normalized.contains("scitaj") || normalized.contains("spocitaj") -> "Vysledok je ${numbers[0] + numbers[1]}."
                                      normalized.contains("minus") || normalized.contains("odcitaj") -> "Vysledok je ${numbers[0] - numbers[1]}."
                                      else -> "Rozumiem. Ak chces vypocitat priklad, povedz napríklad: kolko je 150 deleno 3."
                                  }
                              }
                          else ->
                              "Prepáč, tejto otázke zatiaľ nerozumiem. Skús sa ma opýtať na trasu, spotrebu paliva alebo vozidlo, prípadne povedz pomoc."
                      }
                      nikoPendingSpeech.value = answer
                      Toast.makeText(context, answer, Toast.LENGTH_LONG).show()
                  } else {
                      if (nikoHandsFreeMode.value) {
                          Toast.makeText(context, "Niko ťa nezachytil. Skús hovoriť po slovensky, zreteľne a po krátkej pauze.", Toast.LENGTH_SHORT).show()
                          nikoListenAgain.value = true
                      } else {
                          Toast.makeText(context, "Niko nezachytil reč. Skús to znova.", Toast.LENGTH_SHORT).show()
                      }
                  }
                  assistantListening = false
              }
              val nikoMicPermissionLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { granted ->
                  if (granted) {
                      val recognitionIntentAvailable = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).resolveActivity(context.packageManager) != null
                      if (!recognitionIntentAvailable) {
                          assistantListening = false
                          nikoHandsFreeMode.value = false
                          Toast.makeText(context, "V telefóne nie je dostupná služba rozpoznávania reči. Aktualizuj alebo povoľ Google Speech Services.", Toast.LENGTH_LONG).show()
                      } else {
                      val speechIntent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "sk-SK")
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "sk-SK")
                          putExtra(RecognizerIntent.EXTRA_PROMPT, "Niko počúva. Povedz niečo po slovensky.")
                          putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                          // Allow network speech recognition when offline Slovak data is unavailable.
                      }
                      try {
                          assistantListening = true
                          nikoSpeechLauncherForHome.launch(speechIntent)
                      } catch (e: Exception) {
                          assistantListening = false
                          Toast.makeText(context, "Rozpoznávanie reči nie je v telefóne dostupné.", Toast.LENGTH_LONG).show()
                      }
                      }
                  } else {
                      assistantListening = false
                      Toast.makeText(context, "Povoľ mikrofón pre OLI RouteSave v nastaveniach telefónu.", Toast.LENGTH_LONG).show()
                  }
              }
              LaunchedEffect(nikoListenAgain.value, nikoHandsFreeMode.value) {
                  if (nikoListenAgain.value && nikoHandsFreeMode.value && !assistantListening) {
                      delay(400)
                      nikoListenAgain.value = false
                      val nextSpeechIntent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "sk-SK")
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "sk-SK")
                          putExtra(RecognizerIntent.EXTRA_PROMPT, "Niko počúva. Pokračuj v rozhovore.")
                          putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                          // Allow network speech recognition when offline Slovak data is unavailable.
                      }
                      try {
                          assistantListening = true
                          nikoSpeechLauncherForHome.launch(nextSpeechIntent)
                      } catch (e: Exception) {
                          assistantListening = false
                          nikoHandsFreeMode.value = false
                          Toast.makeText(context, "Nepodarilo sa pokračovať v počúvaní. Spusť hlasový režim znova.", Toast.LENGTH_LONG).show()
                      }
                  }
              }
              // Speak the OLI welcome once after the home screen's text-to-speech engine is ready.
              LaunchedEffect(nikoTtsReady.value) {
                  if (nikoTtsReady.value && !nikoWelcomeSpoken.value) {
                      nikoWelcomeSpoken.value = true
                      val welcomeLanguage = nikoTtsEngine.setLanguage(java.util.Locale("sk", "SK"))
                      if (welcomeLanguage != TextToSpeech.LANG_MISSING_DATA && welcomeLanguage != TextToSpeech.LANG_NOT_SUPPORTED) {
                          nikoTtsEngine.setSpeechRate(0.92f)
                          nikoTtsEngine.setPitch(0.95f)
                          nikoTtsEngine.speak("Dobrý deň, ako ti môžem pomôcť?", TextToSpeech.QUEUE_ADD, null, "oli-welcome")
                          nikoTtsStatus.value = "OLI vás víta"
                      } else {
                          nikoTtsStatus.value = "Chýba slovenský hlas v telefóne"
                      }
                  }
              }

              // This loops conversation turns only while the app stays open; wake-word/background listening is a separate step.

          """
          app_marker = "fun RouteSaveComposeApp()"
          app_start = s.find(app_marker)
          if app_start < 0:
              raise SystemExit("Could not locate RouteSaveComposeApp for voice setup.")
          composable_anchor = "    val context = LocalContext.current"
          anchor_at = s.find(composable_anchor, app_start)
          if anchor_at < 0:
              raise SystemExit("Could not locate app context inside RouteSaveComposeApp.")
          # Always inject a uniquely named launcher into this composable's own scope.
          insert_at = anchor_at + len(composable_anchor)
          s = s[:insert_at] + "\n" + voice_setup + s[insert_at:]
          old_handler = "onAssistantClick = { assistantListening = !assistantListening }"
          wired_handler = """onAssistantClick = {
                              if (nikoHandsFreeMode.value) {
                                  nikoHandsFreeMode.value = false
                                  nikoListenAgain.value = false
                                  assistantListening = false
                                  Toast.makeText(context, "Niko: hlasový režim vypnutý.", Toast.LENGTH_SHORT).show()
                              } else {
                                  nikoHandsFreeMode.value = true
                                  nikoMicPermissionLauncher.launch(android.Manifest.permission.RECORD_AUDIO)
                              }
                          }"""
          s = s.replace("onAssistantClick = { startNikoSpeech() }", old_handler)
          if old_handler not in s:
              raise SystemExit("Could not find Niko voice button handler.")
          s = s.replace(old_handler, wired_handler, 1)
          # Do not duplicate HomeScreen tripHistoryService wiring; the existing
          # compatibility patches below own that parameter and its call sites.
          # Locate the calculator wherever it is defined in the Android project.
          project = Path("android-project")
          calculator_file = None
          calculator_source = None
          for candidate in project.glob("app/src/main/java/**/*.kt"):
              candidate_source = candidate.read_text()
              if "TripCostQuickCalculator" in candidate_source and "distanceText" in candidate_source:
                  calculator_file = candidate
                  # If the calculator is in RouteSaveComposeApp.kt, preserve the
                  # voice launcher/handler changes already applied to in-memory s.
                  calculator_source = s if candidate.resolve() == compose.resolve() else candidate_source
                  break
          if calculator_file is None:
              raise SystemExit("Could not safely locate the trip calculator source.")
          calculator_pattern = re.compile(r'(@Composable\s+(?:private\s+)?fun\s+TripCostQuickCalculator\s*\([^)]*\)\s*\{)', re.S)
          match = calculator_pattern.search(calculator_source)
          if not match:
              raise SystemExit("Calculator declaration not found; refusing an unsafe patch.")
          if "last_distance_km" not in calculator_source:
              calculator_source = calculator_source[:match.end()] + '\n    val routeContext = androidx.compose.ui.platform.LocalContext.current' + calculator_source[match.end():]
          new_distance_state = '''var distanceText by rememberSaveable { mutableStateOf("") }
          val routePreferences = routeContext.getSharedPreferences("oli_routesave_route", android.content.Context.MODE_PRIVATE)
          androidx.compose.runtime.DisposableEffect(routePreferences) {
              fun refreshRouteDistance() {
                  val savedKm = routePreferences.getFloat("last_distance_km", 0f)
                  if (savedKm > 0f) {
                      val formattedKm = String.format(java.util.Locale.getDefault(), "%.1f", savedKm)
                      if (distanceText != formattedKm) distanceText = formattedKm
                  }
              }
              val routePreferenceListener = android.content.SharedPreferences.OnSharedPreferenceChangeListener { _, key ->
                  if (key == "last_distance_km") refreshRouteDistance()
              }
              routePreferences.registerOnSharedPreferenceChangeListener(routePreferenceListener)
              refreshRouteDistance()
              onDispose { routePreferences.unregisterOnSharedPreferenceChangeListener(routePreferenceListener) }
          }'''
          state_patterns = [
              'var distanceText by rememberSaveable { mutableStateOf("") }',
              'var distanceText by rememberSaveable { mutableStateOf("100") }',
          ]
          patched_state = False
          for state_pattern in state_patterns:
              if state_pattern in calculator_source:
                  calculator_source = calculator_source.replace(state_pattern, new_distance_state, 1)
                  patched_state = True
                  break
          if not patched_state and "routeLifecycleOwner" not in calculator_source:
              raise SystemExit("Calculator distance state has an unexpected form; refusing an unsafe patch.")
          # Add a real road-distance lookup to the quick calculator. Geocode both
          # locations with Nominatim, then use OSRM's driving route distance.
          calculator_marker = '    var originText by rememberSaveable { mutableStateOf("") }'
          calculator_add = """    val calculatorScope = rememberCoroutineScope()
              var routeLookupLoading by rememberSaveable { mutableStateOf(false) }
              var routeLookupMessage by rememberSaveable { mutableStateOf("") }
              suspend fun findRoadDistanceKm(start: String, end: String): Double = withContext(Dispatchers.IO) {
                  fun geocode(place: String): Pair<Double, Double> {
                      val encoded = URLEncoder.encode(place, "UTF-8")
                      val connection = URL("https://nominatim.openstreetmap.org/search?q=$encoded&format=json&limit=1").openConnection() as java.net.HttpURLConnection
                      connection.connectTimeout = 10000
                      connection.readTimeout = 12000
                      connection.setRequestProperty("User-Agent", "OLI-RouteSave/1.0 (route distance lookup)")
                      try {
                          val body = connection.inputStream.bufferedReader().use { it.readText() }
                          val results = org.json.JSONArray(body)
                          if (results.length() == 0) throw IllegalArgumentException("Miesto sa nenašlo: $place")
                          val item = results.getJSONObject(0)
                          Pair(item.getString("lon").toDouble(), item.getString("lat").toDouble())
                      } finally { connection.disconnect() }
                  }
                  val a = geocode(start)
                  val b = geocode(end)
                  val routeUrl = "https://routing.openstreetmap.de/routed-car/route/v1/driving/" + a.first + "," + a.second + ";" + b.first + "," + b.second + "?overview=false"
                  val connection = URL(routeUrl).openConnection() as java.net.HttpURLConnection
                  connection.connectTimeout = 10000
                  connection.readTimeout = 15000
                  connection.setRequestProperty("User-Agent", "OLI-RouteSave/1.0 (Android route distance lookup)")
                  connection.setRequestProperty("Accept", "application/json")
                  try {
                      val body = connection.inputStream.bufferedReader().use { it.readText() }
                      val root = JSONObject(body)
                      if (root.optString("code") != "Ok") throw IllegalArgumentException("Cestu sa nepodarilo vypočítať.")
                      val routes = root.getJSONArray("routes")
                      if (routes.length() == 0) throw IllegalArgumentException("Pre tieto miesta sa nenašla cesta.")
                      routes.getJSONObject(0).getDouble("distance") / 1000.0
                  } finally { connection.disconnect() }
              }
          """
          if calculator_marker not in calculator_source:
              raise SystemExit("Could not locate calculator input section for road-distance lookup.")
          if "findRoadDistanceKm" not in calculator_source:
              calculator_source = calculator_source.replace(calculator_marker, calculator_add + calculator_marker, 1)
          distance_field_pos = calculator_source.find("value = distanceText,")
          if distance_field_pos < 0:
              raise SystemExit("Could not locate distance field to insert route button.")
          calculator_ui_start = calculator_source.rfind("OutlinedTextField(", 0, distance_field_pos)
          if calculator_ui_start < 0:
              raise SystemExit("Could not locate distance field declaration.")
          calculator_ui = '''            Button(
                  enabled = !routeLookupLoading && originText.isNotBlank() && destinationText.isNotBlank(),
                  onClick = {
                      calculatorScope.launch {
                          routeLookupLoading = true
                          routeLookupMessage = "Počítam cestnú vzdialenosť…"
                          try {
                              val km = findRoadDistanceKm(originText.trim(), destinationText.trim())
                              distanceText = String.format(java.util.Locale.US, "%.1f", km)
                              routeLookupMessage = "Vypočítaná cestná vzdialenosť: %.1f km".format(java.util.Locale.getDefault(), km)
                              resultText = ""
                              lastSavedEstimate = null
                              saveMessage = ""
                          } catch (e: Exception) {
                              routeLookupMessage = "Vzdialenosť sa nepodarilo vypočítať. Skontroluj názvy miest a internet."
                          } finally {
                              routeLookupLoading = false
                          }
                      }
                  },
