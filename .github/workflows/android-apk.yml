          s = s.replace(anchor, '                    when (selectedTab) {\n                        "Settings" -> BasicSettingsScreen(onBack = { selectedTab = AppTab.More.name })\n                        "Vehicle" -> VehicleProfileScreen(', 1)
          s = s.rstrip() + '''
          
