      - name: Add live GPS status and speed to driving screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android-project/app/src/main/java/com/oli/routesave/ui/compose/RouteSaveComposeApp.kt")
          s = p.read_text()
          pattern = re.compile(r'@Composable\s+private fun DriveScreen\(.*?\n\s*\}\n\n\s*@Composable\n\s*private fun CommunityScreen', re.S)
          replacement = r'''@Composable
          private fun DriveScreen(
              driveRunning: Boolean,
              onToggleDrive: () -> Unit,
              assistantListening: Boolean,
              onAssistantClick: () -> Unit
          ) {
              val driveContext = LocalContext.current
              val drivePrefs = remember(driveContext) { driveContext.getSharedPreferences("oli_routesave_route", android.content.Context.MODE_PRIVATE) }
              val savedRouteGeometry = drivePrefs.getString("last_route_geometry", null)
              val savedRouteDistance = drivePrefs.getFloat("last_distance_km", 0f)
              val savedRouteDestination = drivePrefs.getString("last_destination", "")
              var liveLocation by remember { mutableStateOf<android.location.Location?>(null) }
              var gpsActive by rememberSaveable { mutableStateOf(false) }
              val gpsPermissionLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { grants ->
                  if (grants[android.Manifest.permission.ACCESS_FINE_LOCATION] == true || grants[android.Manifest.permission.ACCESS_COARSE_LOCATION] == true) gpsActive = true
              }
              DisposableEffect(gpsActive) {
                  val manager = driveContext.getSystemService(android.content.Context.LOCATION_SERVICE) as android.location.LocationManager
                  val fine = androidx.core.content.ContextCompat.checkSelfPermission(driveContext, android.Manifest.permission.ACCESS_FINE_LOCATION) == android.content.pm.PackageManager.PERMISSION_GRANTED
                  val coarse = androidx.core.content.ContextCompat.checkSelfPermission(driveContext, android.Manifest.permission.ACCESS_COARSE_LOCATION) == android.content.pm.PackageManager.PERMISSION_GRANTED
                  val listener = object : android.location.LocationListener {
                      override fun onLocationChanged(location: android.location.Location) { liveLocation = location }
                      @Deprecated("Deprecated by Android")
                      override fun onStatusChanged(provider: String?, status: Int, extras: android.os.Bundle?) {}
                      override fun onProviderEnabled(provider: String) {}
                      override fun onProviderDisabled(provider: String) {}
                  }
                  if (gpsActive && (fine || coarse)) {
                      listOf(android.location.LocationManager.GPS_PROVIDER, android.location.LocationManager.NETWORK_PROVIDER).forEach { provider ->
                          try {
                              if (manager.isProviderEnabled(provider)) {
                                  manager.getLastKnownLocation(provider)?.let { last ->
                                      if (liveLocation == null || last.time > (liveLocation?.time ?: 0L)) liveLocation = last
                                  }
                                  manager.requestLocationUpdates(provider, 2000L, 2f, listener, android.os.Looper.getMainLooper())
                              }
                          } catch (_: SecurityException) { } catch (_: IllegalArgumentException) { }
                      }
                  }
                  onDispose { try { manager.removeUpdates(listener) } catch (_: Exception) { } }
              }
              val speedText = liveLocation?.takeIf { it.hasSpeed() }?.let { String.format(java.util.Locale.getDefault(), "%.0f km/h", it.speed * 3.6f) } ?: "-- km/h"
              val gpsText = liveLocation?.let { String.format(java.util.Locale.getDefault(), "GPS: %.5f, %.5f", it.latitude, it.longitude) } ?: if (gpsActive) "Čakám na polohu GPS…" else "Živá poloha je vypnutá."
              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  Text("Jazda", fontSize = 25.sp, fontWeight = FontWeight.Bold)
                  Surface(color = MaterialTheme.colorScheme.primary, shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(16.dp)) {
                          Text(if (savedRouteGeometry != null) "Vypočítaná trasa je pripravená" else "Navigácia ešte nie je pripojená", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 20.sp)
                          Text(if (savedRouteGeometry != null) "Cieľ: " + (savedRouteDestination ?: "") + " • vypočítaná trasa: " + String.format(java.util.Locale.getDefault(), "%.1f km", savedRouteDistance) + ". Živé GPS a pokyny na odbočenie sa pripájajú postupne." else "Najprv vypočítaj trasu na obrazovke Trasa. Živé GPS a pokyny na odbočenie ešte nie sú pripojené.", color = Color.White)
                      }
                  }
                  MapLibreMapView(Modifier.fillMaxWidth().height(200.dp), routeGeometry = savedRouteGeometry)
                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      MetricCard("Trasa", if (savedRouteGeometry != null) String.format(java.util.Locale.getDefault(), "%.0f km", savedRouteDistance) else "— km", Modifier.weight(1f))
                      MetricCard("Príchod", "—", Modifier.weight(1f))
                      MetricCard("Rýchlosť", speedText, Modifier.weight(1f))
                  }
                  Surface(color = MaterialTheme.colorScheme.surface, shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth()) { Text(gpsText, modifier = Modifier.padding(12.dp), color = MaterialTheme.colorScheme.onSurfaceVariant) }
                  OutlinedButton(onClick = {
                      val fine = androidx.core.content.ContextCompat.checkSelfPermission(driveContext, android.Manifest.permission.ACCESS_FINE_LOCATION) == android.content.pm.PackageManager.PERMISSION_GRANTED
                      val coarse = androidx.core.content.ContextCompat.checkSelfPermission(driveContext, android.Manifest.permission.ACCESS_COARSE_LOCATION) == android.content.pm.PackageManager.PERMISSION_GRANTED
                      if (fine || coarse) gpsActive = !gpsActive else gpsPermissionLauncher.launch(arrayOf(android.Manifest.permission.ACCESS_FINE_LOCATION, android.Manifest.permission.ACCESS_COARSE_LOCATION))
                  }, modifier = Modifier.fillMaxWidth()) { Text(if (gpsActive) "Vypnúť živé GPS" else "Zapnúť živé GPS") }
                  OutlinedButton(onClick = onAssistantClick, modifier = Modifier.fillMaxWidth(), contentPadding = PaddingValues(horizontal = 12.dp, vertical = 12.dp)) {
                      Icon(Icons.Filled.Mic, contentDescription = null, modifier = Modifier.padding(end = 8.dp))
                      Text(if (assistantListening) "Niko počúva…" else "Hovoriť s Nikom", maxLines = 2, softWrap = true, textAlign = androidx.compose.ui.text.style.TextAlign.Center)
                  }
                  Button(onClick = onToggleDrive, modifier = Modifier.fillMaxWidth().height(56.dp), colors = ButtonDefaults.buttonColors(containerColor = if (driveRunning) Color(0xFFE53935) else MaterialTheme.colorScheme.primary)) { Text(if (driveRunning) "UKONČIŤ JAZDU" else "SPUSTIŤ JAZDU") }
              }
          }

          @Composable
          private fun CommunityScreen'''
          replacement = replacement.replace("          ", "")
          s, count = pattern.subn(lambda _: replacement, s, count=1)
          if count != 1: raise SystemExit("DriveScreen could not be replaced exactly once; refusing to build.")
          p.write_text(s)
          print("Added user-controlled foreground GPS updates and live speed display to DriveScreen.")
          PY

      - name: Add current GPS marker to the driving map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("android-project/app/src/main")
          candidates = [p for p in root.rglob("*.kt") if "fun MapLibreMapView(" in p.read_text()]
          if not candidates:
              raise SystemExit("MapLibreMapView was not generated in any Kotlin source file.")
          p = candidates[0]
          s = p.read_text()
          signature_pattern = r'fun MapLibreMapView\(modifier: Modifier = Modifier, routeGeometry: String\? = null\)'
          s, count = re.subn(signature_pattern, 'fun MapLibreMapView(modifier: Modifier = Modifier, routeGeometry: String? = null, liveLocation: android.location.Location? = null)', s, count=1)
          if count == 0 and "liveLocation: android.location.Location? = null" not in s:
              raise SystemExit("Could not extend MapLibreMapView signature.")
          marker = "                              val geometryText = routeGeometry"
          injected = """                              liveLocation?.let { location ->
                                  try {
                                      map.addMarker(org.maplibre.android.annotations.MarkerOptions()
                                          .position(LatLng(location.latitude, location.longitude))
                                          .title("Aktuálna poloha"))
                                  } catch (_: Exception) { }
                              }
                              val geometryText = routeGeometry"""
          if marker in s:
              s = s.replace(marker, injected, 1)
          elif 'title("Aktuálna poloha")' not in s:
              raise SystemExit("MapLibre style callback insertion point not found.")
          p.write_text(s)
          compose = root / "java/com/oli/routesave/ui/compose/RouteSaveComposeApp.kt"
          if compose.exists():
              t = compose.read_text()
              old_call = "MapLibreMapView(Modifier.fillMaxWidth().height(200.dp), routeGeometry = savedRouteGeometry)"
              new_call = "MapLibreMapView(Modifier.fillMaxWidth().height(200.dp), routeGeometry = savedRouteGeometry, liveLocation = liveLocation)"
              if old_call in t:
                  t = t.replace(old_call, new_call, 1)
              elif new_call not in t:
                  raise SystemExit("Driving screen map call not found.")
              compose.write_text(t)
          print("Added live GPS marker before route rendering; existing route rendering is preserved.")
          PY

      - name: Final cleanup of demo wording on home voice card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android-project/app/src/main")
          changed = []
          for p in root.rglob("*.kt"):
              original = p.read_text()
              updated = original.replace("ukážkový režim", "hlasový režim")
              updated = updated.replace("Ukážková jazda", "Jazda")
              updated = updated.replace("SPUSTIŤ UKÁŽKOVÚ JAZDU", "SPUSTIŤ JAZDU")
              if updated != original:
                  p.write_text(updated)
                  changed.append(str(p))
          print("Final demo-wording cleanup:", ", ".join(changed) if changed else "no matching wording")
          PY

      - name: Give test APK a unique package ID for this build
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          suffix = ".test" + os.environ["GITHUB_RUN_NUMBER"]
          p = Path("android-project/app/build.gradle.kts")
          lines = p.read_text().splitlines()
          # applicationIdSuffix belongs in a build type, not defaultConfig.
          lines = [line for line in lines if "applicationIdSuffix" not in line]
          for index, line in enumerate(lines):
              if line.strip() == 'getByName("debug") {':
                  lines.insert(index + 1, f'            applicationIdSuffix = "{suffix}"')
                  p.write_text("\n".join(lines) + "\n")
                  print(f"Test APK package suffix set to {suffix} in debug build type.")
                  break
          else:
              raise SystemExit('debug build type not found; refusing to change package ID blindly.')
          PY

      - name: Configure persistent APK signing when repository secrets are available
        env:
          OLI_KEYSTORE_BASE64: ${{ secrets.OLI_KEYSTORE_BASE64 }}
          OLI_KEYSTORE_PASSWORD: ${{ secrets.OLI_KEYSTORE_PASSWORD }}
          OLI_KEY_ALIAS: ${{ secrets.OLI_KEY_ALIAS }}
          OLI_KEY_PASSWORD: ${{ secrets.OLI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${OLI_KEYSTORE_BASE64:-}" ] || [ -z "${OLI_KEYSTORE_PASSWORD:-}" ] || [ -z "${OLI_KEY_ALIAS:-}" ] || [ -z "${OLI_KEY_PASSWORD:-}" ]; then
            echo "Persistent signing secrets are not configured; keeping the normal debug signing for this build."
            exit 0
          fi
          printf '%s' "$OLI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oli-routesave-signing.jks"
          cat >> android-project/app/build.gradle.kts <<'GRADLE'

          // Use the same protected upload key for every future signed test APK.
          android {
              signingConfigs {
                  create("oliPersistent") {
                      storeFile = file(System.getenv("RUNNER_TEMP") + "/oli-routesave-signing.jks")
                      storePassword = System.getenv("OLI_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("OLI_KEY_ALIAS")
                      keyPassword = System.getenv("OLI_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("oliPersistent")
                  }
              }
          }
          GRADLE
          echo "Persistent signing configuration added (key material stays outside the repository)."

      - name: Build debug APK and save build log
        shell: bash
        run: |
          set -o pipefail
          cd android-project
          gradle --no-daemon :app:lintDebug :app:assembleDebug 2>&1 | tee ../build-log.txt

      - name: Verify APK has a separate test package ID
        shell: bash
        run: |
          set -euo pipefail
          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT" || { echo "Android aapt tool not found"; exit 1; }
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -n 1
          PACKAGE="$(printf '%s\n' "$BADGING" | awk -F"'" '/^package: name=/{print $2; exit}')"
          echo "Built APK package ID: ${PACKAGE:-<EMPTY>}"
          if [ -z "$PACKAGE" ]; then
            echo "ERROR: Could not read package ID from APK badging output."
            exit 1
          fi
          EXPECTED_SUFFIX=".test${GITHUB_RUN_NUMBER}"
          case "$PACKAGE" in
            *"$EXPECTED_SUFFIX") echo "Verified: APK uses unique package suffix $EXPECTED_SUFFIX." ;;
            *) echo "ERROR: APK package ID does not end in $EXPECTED_SUFFIX; refusing to upload an unverified APK."; exit 1 ;;
          esac

      - name: Run unit tests
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          cd android-project
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee ../unit-test-log.txt

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OLI-RouteSave-debug-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error