      - name: Add branded OLI RouteSave launch screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          app = Path("android-project/app/src/main")
          manifest = app / "AndroidManifest.xml"
          if not manifest.exists():
              matches = list(app.rglob("AndroidManifest.xml"))
              if not matches:
                  raise SystemExit("AndroidManifest.xml not found")
              manifest = matches[0]
          tree = ET.parse(manifest)
          root = tree.getroot()
          android_ns = "{http://schemas.android.com/apk/res/android}"
          app_node = root.find("application")
          if app_node is None:
              raise SystemExit("Manifest application element not found")
          launch_activity = None
          for node in app_node.iter():
              if not node.tag.endswith("activity") and not node.tag.endswith("activity-alias"):
                  continue
              for intent in node.findall("intent-filter"):
                  actions = {e.attrib.get(android_ns + "name") for e in intent.findall("action")}
                  categories = {e.attrib.get(android_ns + "name") for e in intent.findall("category")}
                  if "android.intent.action.MAIN" in actions and "android.intent.category.LAUNCHER" in categories:
                      launch_activity = node
                      break
              if launch_activity is not None:
                  break
          if launch_activity is None:
              raise SystemExit("Launcher activity with MAIN/LAUNCHER intent filter not found")
          old_theme = launch_activity.attrib.get(android_ns + "theme") or app_node.attrib.get(android_ns + "theme")
          if not old_theme:
              raise SystemExit("No existing theme found on launcher activity or application")
          res = app / "res"
          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / "oli_launch_background.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#06172B" />
                  </shape>
              </item>
              <item android:gravity="center">
                  <bitmap android:src="@drawable/oli_brand_logo" android:gravity="center" />
              </item>
          </layer-list>
          """)
          styles = values / "styles.xml"
          existing = styles.read_text() if styles.exists() else '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'
          if "OLIRouteSaveLaunchTheme" not in existing:
              theme = f"""
              <style name="OLIRouteSaveLaunchTheme" parent="{old_theme}">
                  <item name="android:windowBackground">@drawable/oli_launch_background</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
              """
              existing = existing.replace("</resources>", theme + "\n</resources>")
              styles.write_text(existing)
          launch_activity.set(android_ns + "theme", "@style/OLIRouteSaveLaunchTheme")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("Applied branded OLI launch window to detected launcher activity.")
          PY

