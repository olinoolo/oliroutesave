          from pathlib import Path
          p = Path("android-project/app/src/main/java/com/oli/routesave/ui/compose/RouteSaveComposeApp.kt")
          s = p.read_text()
          old_geo = 'val body = connection.inputStream.bufferedReader().use { it.readText() }'
          new_geo = '''val status = connection.responseCode
                          val stream = if (status in 200..299) connection.inputStream else connection.errorStream
                          val body = stream?.bufferedReader()?.use { it.readText() } ?: ""
