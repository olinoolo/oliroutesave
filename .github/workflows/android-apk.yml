      - name: Build debug APK and save build log
        shell: bash
        run: |
          set -o pipefail
          cd android-project
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee ../build-log.txt

